server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Core MIME types - this is the fix for your errors
    types {
        application/javascript js mjs;
        text/css css;
        text/html html;
        application/manifest+json webmanifest;
        image/svg+xml svg;
        image/x-icon ico;
    }

    default_type application/octet-stream;

    # Ensure JS files have correct MIME type
    location ~* \.(js|mjs)$ {
        types { application/javascript js mjs; }
        default_type application/javascript;
    }

    # Ensure CSS files have correct MIME type  
    location ~* \.css$ {
        types { text/css css; }
        default_type text/css;
    }

    # Ensure webmanifest has correct MIME type
    location ~* \.webmanifest$ {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
    }

    # SPA fallback - handles React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}